# Packages allowed to run install scripts.
# allowBuilds is read by pnpm 11+ (local); onlyBuiltDependencies by pnpm 9/10 (Vercel, lockfile v9).
allowBuilds:
  "@tailwindcss/oxide": true
  sharp: true
  supabase: true
  unrs-resolver: true
  # wrangler (Cloudflare Pages uploads) works without these install scripts.
  esbuild: false
  workerd: false
onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - sharp
  - supabase
  - unrs-resolver
